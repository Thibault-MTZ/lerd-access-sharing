api_version: 1
name: lerd-access-sharing
lerd: ">=1.38"
version: 0.2.0-beta.1
description: Partages natifs LERD et protections IP, Basic Auth et requêtes
docs: DOCS.md
icon: ui/icon.svg
commands:
  - name: shares
    usage: Afficher les partages natifs en lecture seule
    run: bin/shares
api:
  - path: shares
    methods: [GET]
    run: bin/shares
  - path: policy
    methods: [GET, POST]
    run: bin/policy
    loopback_only: true
ui:
  page:
    title: Accès et partages
    icon: ui/icon.svg
    entry: ui/index.html
  site_tab:
    title: Accès
    entry: ui/index.html
